<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rapor SMK Mambaul Ulum</title>
<meta name="description" content="Aplikasi e-Rapor SMK Mambaul Ulum">
<meta name="theme-color" content="#047857">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.png" type="image/png" id="favicon">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --primary:#047857; --primary-2:#10B981; --primary-soft:#ECFDF5;
  --accent:#D97706; --accent-soft:#FEF3C7;
  --bg:#F8FAFC; --surface:rgba(255,255,255,.72); --surface-solid:#FFFFFF;
  --border:rgba(15,23,42,.08); --border-strong:rgba(15,23,42,.14);
  --text:#0F172A; --body:#334155; --muted:#64748B;
  --danger:#DC2626; --danger-soft:#FEE2E2; --info:#2563EB; --info-soft:#DBEAFE;
  --radius:16px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.06);
  --shadow-lg:0 20px 50px rgba(15,23,42,.14);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app-root{position:fixed;inset:0;z-index:999999;background:var(--bg);overflow:hidden}
.app-root::before,.app-root::after{content:"";position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;pointer-events:none}
.app-root::before{width:480px;height:480px;background:#A7F3D0;top:-160px;right:-120px}
.app-root::after{width:420px;height:420px;background:#FDE68A;bottom:-180px;left:-140px;opacity:.4}
.glass{background:var(--surface);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(255,255,255,.7);box-shadow:var(--shadow)}
h1,h2,h3,h4{color:var(--text);margin:0;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:12px}
.hidden{display:none!important}

/* ---------- Layout ---------- */
.layout{position:relative;z-index:1;display:flex;height:100%}
.sidebar{width:260px;flex-shrink:0;margin:14px 0 14px 14px;border-radius:22px;display:flex;flex-direction:column;padding:18px 14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand-logo{width:44px;height:44px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 4px 10px rgba(15,23,42,.15))}
.brand-title{font-weight:800;color:var(--text);font-size:15px;line-height:1.2}
.brand-sub{font-size:11px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 12px 6px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:0;background:none;cursor:pointer;text-align:left;font-weight:600;color:var(--body);transition:background .15s,color .15s}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.nav-item:hover{background:rgba(4,120,87,.07);color:var(--primary)}
.nav-item.active{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(4,120,87,.28)}
.user-box{margin-top:12px;padding:12px;border-radius:14px;background:rgba(255,255,255,.6);border:1px solid var(--border);display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:800;flex-shrink:0}
.user-box .info{flex:1;min-width:0}
.user-box .name{font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.topbar{display:flex;align-items:center;gap:12px;padding:20px 28px 8px}
.topbar h1{font-size:22px;font-weight:800}
.topbar .spacer{flex:1}
.view{flex:1;overflow-y:auto;padding:12px 28px 40px}
.bottomnav{display:none}
.preview-banner{position:relative;z-index:2;background:linear-gradient(90deg,#F59E0B,#D97706);color:#fff;font-weight:700;font-size:12px;text-align:center;padding:6px 12px}

/* ---------- Components ---------- */
.card{border-radius:var(--radius);padding:20px}
.card + .card{margin-top:16px}
.card-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card-head h3{font-size:16px;font-weight:700}
.card-head .spacer{flex:1}
.grid{display:grid;gap:16px}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{border-radius:var(--radius);padding:18px;display:flex;gap:14px;align-items:center}
.stat-icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex-shrink:0}
.stat-icon svg{width:22px;height:22px}
.stat-val{font-size:24px;font-weight:800;color:var(--text);line-height:1.1}
.stat-lbl{font-size:12px;color:var(--muted);font-weight:600}
.c-green{background:var(--primary-soft);color:var(--primary)}
.c-amber{background:var(--accent-soft);color:var(--accent)}
.c-blue{background:var(--info-soft);color:var(--info)}
.c-red{background:var(--danger-soft);color:var(--danger)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid transparent;font-weight:700;cursor:pointer;transition:transform .1s,box-shadow .15s,background .15s;white-space:nowrap;font-size:13px}
.btn svg{width:16px;height:16px}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(4,120,87,.25)}
.btn-primary:hover{background:#065F46}
.btn-ghost{background:rgba(255,255,255,.7);border-color:var(--border-strong);color:var(--text)}
.btn-ghost:hover{background:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-accent{background:var(--accent);color:#fff}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:9px}
.btn-icon{padding:7px;border-radius:9px}
.btn-block{width:100%}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700}
.b-green{background:var(--primary-soft);color:var(--primary)}
.b-amber{background:var(--accent-soft);color:#B45309}
.b-red{background:var(--danger-soft);color:var(--danger)}
.b-gray{background:#F1F5F9;color:var(--muted)}
.b-blue{background:var(--info-soft);color:var(--info)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;font-weight:700;color:var(--text)}
.field .hint{font-size:11px;color:var(--muted)}
.input,select.input,textarea.input{width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--border-strong);background:rgba(255,255,255,.85);outline:none;transition:border .15s,box-shadow .15s}
.input:focus{border-color:var(--primary-2);box-shadow:0 0 0 3px rgba(16,185,129,.18)}
textarea.input{resize:vertical;min-height:60px}
.input-sm{padding:7px 9px;border-radius:9px;font-size:13px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .full{grid-column:1/-1}
.check{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--primary)}
.search{position:relative;flex:1;min-width:180px;max-width:320px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search input{padding-left:36px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.6)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:11px 12px;background:rgba(248,250,252,.9);border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:rgba(236,253,245,.45)}
.tbl .num{width:44px;color:var(--muted)}
.tbl .act{white-space:nowrap;text-align:right}
.tbl td .input-sm{min-width:70px}
.empty{text-align:center;padding:42px 16px;color:var(--muted)}
.empty svg{width:42px;height:42px;color:#CBD5E1;margin-bottom:8px}
.empty h4{color:var(--text);font-size:15px;margin-bottom:4px}
.skeleton{height:14px;border-radius:7px;background:linear-gradient(90deg,#EEF2F7 25%,#F8FAFC 50%,#EEF2F7 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.progress{height:10px;border-radius:99px;background:#E2E8F0;overflow:hidden}
.progress > span{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-2));border-radius:99px;transition:width .6s}
.list-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.65);cursor:pointer;transition:border .15s,transform .15s}
.list-item:hover{border-color:var(--primary-2);transform:translateY(-1px)}
.list-item + .list-item{margin-top:8px}
.list-item .grow{flex:1;min-width:0}
.list-item .t{font-weight:700;color:var(--text)}
.hero{border-radius:20px;padding:22px 24px;background:linear-gradient(135deg,#047857,#10B981);color:#fff;display:flex;align-items:center;gap:16px;margin-bottom:16px;box-shadow:0 14px 34px rgba(4,120,87,.25)}
.hero h2{color:#fff;font-size:20px}
.hero p{margin:4px 0 0;opacity:.9}
.hero .spacer{flex:1}
.hero-badge{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);padding:8px 14px;border-radius:12px;font-weight:700;font-size:12px;text-align:center}

/* ---------- Login ---------- */
.login-wrap{position:relative;z-index:1;height:100%;overflow-y:auto;display:grid;place-items:center;padding:24px 16px}
.login-card{width:100%;max-width:420px;border-radius:24px;padding:30px 28px}
.login-head{text-align:center;margin-bottom:22px}
.login-head .brand-logo{width:96px;height:96px;margin:0 auto 14px;display:block}
.login-head h1{font-size:22px;font-weight:800}
.tabs{display:flex;background:rgba(241,245,249,.9);border-radius:12px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font-weight:700;cursor:pointer;color:var(--muted)}
.tabs button.active{background:#fff;color:var(--primary);box-shadow:0 2px 6px rgba(15,23,42,.08)}
.stack{display:flex;flex-direction:column;gap:14px}
.quick{margin-top:18px;padding-top:16px;border-top:1px dashed var(--border-strong)}
.quick-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}

/* ---------- Modal & toast ---------- */
.modal-wrap{position:fixed;inset:0;z-index:1000001;background:rgba(15,23,42,.35);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;animation:fade .15s}
.modal{width:100%;max-width:560px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;border-radius:20px;background:rgba(255,255,255,.94);box-shadow:var(--shadow-lg);animation:pop .18s}
.modal.wide{max-width:900px}
.modal-head{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{flex:1;font-size:17px}
.modal-body{padding:20px;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--border)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:1000002;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:11px 16px;border-radius:12px;color:#fff;font-weight:600;box-shadow:var(--shadow-lg);animation:pop .2s;max-width:90vw;display:flex;gap:8px;align-items:center}
.toast.ok{background:#065F46}.toast.err{background:#B91C1C}.toast.info{background:#1E293B}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite}
.spin.dark{border-color:rgba(4,120,87,.2);border-top-color:var(--primary)}
@keyframes rot{to{transform:rotate(360deg)}}
.sheet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sheet-grid button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:14px;border:1px solid var(--border);background:#fff;font-weight:600;font-size:12px;cursor:pointer;text-align:center}
.sheet-grid button.active{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.sheet-grid svg{width:20px;height:20px}

/* ---------- Rapor (kertas) ---------- */
.paper{background:#fff;color:#000;padding:28px 32px;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.08);font-family:Arial,Helvetica,sans-serif;font-size:11.5px;line-height:1.35;max-width:820px;margin:0 auto;position:relative;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.paper + .paper{margin-top:20px}
.paper > *{position:relative;z-index:1}
.paper > img.wm{position:absolute;z-index:0;left:50%;top:32%;width:52%;transform:translateX(-50%);opacity:.07;pointer-events:none}
.paper table{width:100%;border-collapse:collapse}
.paper .nil{margin-top:10px}
.paper .nil th,.paper .nil td{border:1px solid #000;padding:4px 6px;vertical-align:top}
.paper .nil th{background:rgba(229,231,235,.85);text-align:center;font-weight:700}
.paper .nil th.judul{font-size:13px;background:#fff}
.paper .nil .grp td{font-weight:700;background:rgba(243,244,246,.85)}
.paper .nil .ctr{text-align:center}
.paper .nil td.cap{font-size:10.5px;text-align:justify}
.paper .nil tr{page-break-inside:avoid}
.paper .blok{margin-top:12px;page-break-inside:avoid}
.paper .dua{display:grid;grid-template-columns:38% 1fr;gap:14px;align-items:start}
.paper .dua .nil{margin-top:0}
.paper .uts-head{border:1.5px solid #000}
.paper .uts-head td{vertical-align:middle;padding:6px 10px}
.paper .uts-head .l{width:150px;background:#4B5563;color:#fff;text-align:center;font-size:9px;font-weight:700}
.paper .uts-head .l img{width:40px;height:40px;object-fit:contain;display:block;margin:0 auto 2px}
.paper .uts-head .t{font-size:17px;font-weight:800;letter-spacing:.01em}
.paper .uts-head .s{font-size:11px;font-weight:700}
.paper .ident2{margin-top:8px}
.paper .ident2 td,.paper .ident3 td{vertical-align:top;padding:1px 3px;font-size:11px}
.paper .ident2 > tbody > tr > td{width:50%}
.paper .ident3 > tbody > tr > td{width:55%}
.paper .ident3 > tbody > tr > td + td{width:45%}
.paper .garis-id{border-bottom:1.5px solid #000;margin:4px 0 6px}
.paper table.halaman > thead > tr > td,.paper table.halaman > tbody > tr > td{padding:0;border:0}
.paper .nil.uts td{padding:3px 6px}
.paper .hadir-uts td{font-size:11px}
.paper .ttd{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;margin-top:20px;text-align:left;page-break-inside:avoid}
.paper .ttd > div:nth-child(2){padding-left:40%}
.paper .ttd .full{grid-column:1/-1;padding-left:32%}
.paper .ttd .sp{height:58px}
.paper .ttd b{text-decoration:underline}
.paper .ttd .garis{display:inline-block;width:170px;border-bottom:1px solid #000}
#print-area{display:none}

/* ---------- Responsif ---------- */
@media (max-width:1100px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .sidebar{display:none}
  .topbar{padding:16px 16px 6px}
  .topbar h1{font-size:19px}
  .view{padding:8px 16px 110px}
  .grid-3,.grid-2{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .bottomnav{display:flex;position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:5;border-radius:20px;padding:6px;justify-content:space-around}
  .bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:8px 2px;border-radius:14px;font-size:10.5px;font-weight:700;color:var(--muted);cursor:pointer}
  .bottomnav button svg{width:20px;height:20px}
  .bottomnav button.active{color:var(--primary);background:var(--primary-soft)}
  .hero{flex-direction:column;align-items:flex-start;padding:18px}
  .hero .spacer{display:none}
  .search{max-width:none}
  .card{padding:16px}
  .paper{padding:16px;font-size:11.5px}
  .modal-wrap{align-items:end;padding:0}
  .modal{max-width:none;border-radius:20px 20px 0 0;max-height:92vh}
}
@media (max-width:420px){.grid-4{grid-template-columns:1fr 1fr}.stat{padding:14px}.stat-val{font-size:20px}}

@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  .app-root,#toast,.modal-wrap{display:none!important}
  #print-area{display:block}
  #print-area .paper{box-shadow:none;border-radius:0;padding:0;max-width:none;overflow:visible;page-break-after:always}
  #print-area .paper:last-child{page-break-after:auto}
  #print-area .paper + .paper{margin-top:0}
}
</style>
</head>
<body>
<div id="app" class="app-root"></div>
<div id="toast"></div>
<div id="print-area"></div>

<script type="module">
// ======================= KONFIGURASI APLIKASI =======================
const IS_PREVIEW = false; // Ubah menjadi false SAAT DEPLOY agar mode preview & data dummy hilang dan terhubung 100% ke Supabase
const SUPABASE_URL = "https://brjcgqserlijgbbnnqri.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_LwFNXyLiLBoofsSNeUiGYw_h5UNJ6gB";
// ====================================================================

const clone = o => JSON.parse(JSON.stringify(o));

const lsSet = v => { try { v ? localStorage.setItem(LS_KEY, JSON.stringify(v)) : localStorage.removeItem(LS_KEY); } catch (e) { /* storage diblokir */ } };

function errMsg(e) {
  if (!e) return 'Terjadi kesalahan';
  if (e.code === '23505') return 'Data sudah ada (duplikat). Periksa kode/username/NISN.';
  if (e.code === '23503') return 'Data tidak bisa dihapus karena masih dipakai data lain.';
  if (e.code === '23514') return 'Isian tidak valid (di luar batas yang diizinkan).';
  if (e.code === '42501') return 'Akses ditolak oleh database. Pastikan SQL sudah dijalankan & Anda login.';
  if (/Invalid login credentials/i.test(e.message || '')) return 'Email atau password admin salah.';
  if (/Failed to fetch/i.test(e.message || '')) return 'Tidak dapat terhubung ke server. Periksa koneksi internet.';
  return e.message || String(e);
}

function toast(msg, type = 'ok') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  $('#toast').appendChild(t);
  setTimeout(() => t.remove(), type === 'err' ? 4500 : 2600);
}

function modal({ title, body = '', foot = '', wide = false }) {
  const w = document.createElement('div');
  w.className = 'modal-wrap';
  w.innerHTML = `<div class="modal ${wide ? 'wide' : ''}">
    <div class="modal-head"><h3>${esc(title)}</h3><button class="btn btn-ghost btn-icon" data-x><i data-lucide="x"></i></button></div>
    <div class="modal-body">${body}</div>${foot ? `<div class="modal-foot">${foot}</div>` : ''}</div>`;
  document.body.appendChild(w);
  const close = () => w.remove();
  w.addEventListener('click', e => { if (e.target === w || e.target.closest('[data-x]')) close(); });
  icons();
  return { el: w, close };
}

function konfirmasi(pesan, label = 'Hapus') {
  return new Promise(res => {
    const m = modal({ title: 'Konfirmasi', body: `<p style="margin:0">${esc(pesan)}</p>`,
      foot: `<button class="btn btn-ghost" data-no>Batal</button><button class="btn btn-danger" data-yes>${esc(label)}</button>` });
    $('[data-no]', m.el).onclick = () => { m.close(); res(false); };
    $('[data-yes]', m.el).onclick = () => { m.close(); res(true); };
    m.el.addEventListener('click', e => { if (e.target === m.el || e.target.closest('[data-x]')) res(false); });
  });
}

async function busy(btn, fn) {
  const html = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Memproses...';
  try { return await fn(); } finally { btn.disabled = false; btn.innerHTML = html; icons(); }
}

let sb = null;

const realApi = {
  async list(t, o = {}) {
    let q = sb.from(t).select(o.select || '*');
    if (o.eq) for (const [k, v] of Object.entries(o.eq)) q = q.eq(k, v);
    if (o.order) q = q.order(o.order, { ascending: o.asc !== false });
    const { data, error } = await q; if (error) throw error; return data || [];
  },
  async count(t, eq) {
    let q = sb.from(t).select('id', { count: 'exact', head: true });
    if (eq) for (const [k, v] of Object.entries(eq)) q = q.eq(k, v);
    const { count, error } = await q; if (error) throw error; return count || 0;
  },
  async insert(t, rows) { const { error } = await sb.from(t).insert(rows); if (error) throw error; },
  async update(t, id, row) { const { error } = await sb.from(t).update(row).eq('id', id); if (error) throw error; },
  async remove(t, id) { const { error } = await sb.from(t).delete().eq('id', id); if (error) throw error; },
  async rpc(fn, p) { const { data, error } = await sb.rpc(fn, p); if (error) throw error; return data; },
  async loginAdmin(email, password) { const { data, error } = await sb.auth.signInWithPassword({ email, password }); if (error) throw error; return data.user; },
  async sessionAdmin() { const { data } = await sb.auth.getSession(); return data.session ? data.session.user : null; },
  async logoutAdmin() { await sb.auth.signOut(); }
};

// Simulasi fungsi RPC Supabase untuk mode preview
function pAkses(tok) {
  if (!tok) { if (S.user && S.user.peran === 'admin') return { peran: 'admin' }; throw new Error('Sesi berakhir, silakan login kembali'); }
  const [peran, id] = String(tok).split(':'); return { peran, ref_id: +id };
}
function pTaAktif() { const t = M.tahun_ajaran.filter(x => x.aktif).sort((a, b) => b.id - a.id)[0]; if (!t) throw new Error('Belum ada tahun ajaran aktif. Atur di menu Pengaturan.'); return t; }
function pCekMengajar(a, k, m) {
  if (a.peran === 'admin') return;
  if (a.peran === 'guru' && (M.mengajar.some(x => x.guru_id === a.ref_id && x.kelas_id == k && x.mapel_id == m) || M.kelas.some(x => x.id == k && x.wali_guru_id === a.ref_id))) return;
  throw new Error('Akses ditolak: Anda tidak mengajar mapel ini dan bukan wali kelas tersebut');
}
function pCekJenis(j) { if (!['UTS', 'AKHIR'].includes(j)) throw new Error('Jenis rapor harus UTS atau AKHIR'); }
function pCekWali(a, k) { if (a.peran === 'admin') return; if (a.peran === 'guru' && M.kelas.some(x => x.id == k && x.wali_guru_id === a.ref_id)) return; throw new Error('Akses ditolak: Anda bukan wali kelas ini'); }
const siswaKelas = k => M.siswa.filter(s => s.kelas_id == k && s.aktif).sort((a, b) => cmp(a.nama, b.nama));
const KEL_URUT = { 'Umum': 1, 'Kejuruan': 2, 'Muatan Lokal': 3, 'Pilihan': 4 };

const PRPC = {
  login_pengguna({ p_username: u = '', p_password: pw }) {
    const g = M.guru.find(x => x.aktif && x.username.toLowerCase() === u.trim().toLowerCase());
    if (g && g.password_hash === pw) return { token: 'guru:' + g.id, peran: 'guru', id: g.id, nama: g.nama };
    throw new Error('Username atau password salah');
  },
  logout_pengguna() { return true; },
  ganti_password({ p_token, p_lama, p_baru }) {
    const a = pAkses(p_token);
    if (String(p_baru || '').length < 6) throw new Error('Password baru minimal 6 karakter');
    const x = M[a.peran].find(r => r.id === a.ref_id);
    if (x.password_hash !== p_lama) throw new Error('Password lama salah');
    x.password_hash = p_baru; return true;
  },
  guru_beranda({ p_token }) {
    const a = pAkses(p_token); if (a.peran !== 'guru') throw new Error('Akses ditolak');
    const g = M.guru.find(x => x.id === a.ref_id);
    const ta = M.tahun_ajaran.filter(x => x.aktif).sort((x, y) => y.id - x.id)[0] || null;
    return {
      guru: { id: g.id, nama: g.nama, nip: g.nip, username: g.username },
      tahun_ajaran: ta,
      mengajar: M.mengajar.filter(m => m.guru_id === g.id || M.kelas.some(k => k.id === m.kelas_id && k.wali_guru_id === g.id)).map(m => {
        const k = M.kelas.find(x => x.id === m.kelas_id), mp = M.mapel.find(x => x.id === m.mapel_id);
        return { kelas_id: k.id, kelas: k.nama, mapel_id: mp.id, mapel: mp.nama, induk_id: mp.induk_id || null, punya_sub: M.mapel.some(c => c.induk_id === mp.id),
          milik: m.guru_id === g.id, pengampu: (M.guru.find(x => x.id === m.guru_id) || {}).nama || '-', jumlah_siswa: siswaKelas(k.id).length };
      }).sort((x, y) => cmp(x.kelas, y.kelas)),
      wali: M.kelas.filter(k => k.wali_guru_id === g.id).map(k => ({ kelas_id: k.id, kelas: k.nama }))
    };
  },
  nilai_kelas({ p_token, p_kelas_id, p_mapel_id }) {
    const a = pAkses(p_token); pCekMengajar(a, p_kelas_id, p_mapel_id); const ta = pTaAktif();
    const cp = M.cp_mapel.find(x => x.kelas_id == p_kelas_id && x.mapel_id == p_mapel_id && x.tahun_ajaran_id === ta.id);
    return {
      cp: cp ? { cp1: cp.cp1, cp2: cp.cp2, cp3: cp.cp3 } : null,
      siswa: siswaKelas(p_kelas_id).map(s => {
        const n = M.nilai.find(x => x.siswa_id === s.id && x.mapel_id == p_mapel_id && x.tahun_ajaran_id === ta.id && x.jenis === 'AKHIR') || {};
        return { siswa_id: s.id, nisn: s.nisn, nama: s.nama, formatif: n.formatif || null, sts: n.sts ?? null, sas: n.sas ?? null, nilai_akhir: n.nilai_akhir ?? null, capaian: n.capaian ?? null };
      })
    };
  },
  simpan_nilai({ p_token, p_kelas_id, p_mapel_id, p_cp, p_data }) {
    const a = pAkses(p_token); pCekMengajar(a, p_kelas_id, p_mapel_id); const ta = pTaAktif(); let c = 0;
    if (p_cp) {
      const cp = M.cp_mapel.find(x => x.kelas_id == p_kelas_id && x.mapel_id == p_mapel_id && x.tahun_ajaran_id === ta.id);
      if (cp) Object.assign(cp, p_cp); else M.cp_mapel.push({ id: ++seq, kelas_id: +p_kelas_id, mapel_id: +p_mapel_id, tahun_ajaran_id: ta.id, ...p_cp });
    }
    for (const r of p_data) {
      if (!M.siswa.some(s => s.id === r.siswa_id && s.kelas_id == p_kelas_id)) continue;
      const n = M.nilai.find(x => x.siswa_id === r.siswa_id && x.mapel_id == p_mapel_id && x.tahun_ajaran_id === ta.id && x.jenis === 'AKHIR');
      const isi = { formatif: r.formatif ?? null, sts: r.sts ?? null, sas: r.sas ?? null, nilai_akhir: r.nilai_akhir ?? null, capaian: r.capaian ?? null };
      if (n) Object.assign(n, isi);
      else M.nilai.push({ id: ++seq, siswa_id: r.siswa_id, mapel_id: +p_mapel_id, tahun_ajaran_id: ta.id, jenis: 'AKHIR', ...isi });
      c++;
    }
    return c;
  },
  catatan_kelas({ p_token, p_kelas_id, p_jenis }) {
    const a = pAkses(p_token); pCekJenis(p_jenis); pCekWali(a, p_kelas_id); const ta = pTaAktif();
    return siswaKelas(p_kelas_id).map(s => {
      const c = M.catatan_rapor.find(x => x.siswa_id === s.id && x.tahun_ajaran_id === ta.id && x.jenis === p_jenis) || {};
      return { siswa_id: s.id, nisn: s.nisn, nama: s.nama, sakit: c.sakit || 0, izin: c.izin || 0, alpa: c.alpa || 0, kokurikuler: c.kokurikuler || null, ekstrakurikuler: c.ekstrakurikuler || null, prestasi: c.prestasi || null, catatan_wali: c.catatan_wali || null, keputusan: c.keputusan || null };
    });
  },
  simpan_catatan({ p_token, p_kelas_id, p_jenis, p_data }) {
    const a = pAkses(p_token); pCekJenis(p_jenis); pCekWali(a, p_kelas_id); const ta = pTaAktif(); let n = 0;
    for (const r of p_data) {
      if (!M.siswa.some(s => s.id === r.siswa_id && s.kelas_id == p_kelas_id)) continue;
      const c = M.catatan_rapor.find(x => x.siswa_id === r.siswa_id && x.tahun_ajaran_id === ta.id && x.jenis === p_jenis);
      const { siswa_id, ...isi } = r;
      if (c) Object.assign(c, isi); else M.catatan_rapor.push({ id: ++seq, siswa_id, tahun_ajaran_id: ta.id, jenis: p_jenis, ...isi });
      n++;
    }
    return n;
  },
  rapor_siswa({ p_token, p_siswa_id, p_ta_id, p_jenis }) {
    const a = pAkses(p_token); pCekJenis(p_jenis);
    const s = M.siswa.find(x => x.id == p_siswa_id); if (!s) throw new Error('Siswa tidak ditemukan');
    const k = M.kelas.find(x => x.id === s.kelas_id) || null;
    if (a.peran === 'guru' && (!k || k.wali_guru_id !== a.ref_id)) throw new Error('Akses ditolak: Anda bukan wali kelas siswa ini');
    const ta = p_ta_id ? M.tahun_ajaran.find(x => x.id == p_ta_id) : M.tahun_ajaran.filter(x => x.aktif).sort((x, y) => y.id - x.id)[0];

    const nilai = M.mapel.map(m => {
      // nilai diinput sekali; rapor tengah & akhir semester memakai data yang sama
      const n = M.nilai.find(x => x.siswa_id === s.id && x.mapel_id === m.id && x.tahun_ajaran_id === ta.id && x.jenis === 'AKHIR');
      return (mapelKelas.includes(m.id) || indukDipakai.includes(m.id) || n) ? { id: m.id, induk_id: m.induk_id || null, mapel: m.nama, kelompok: m.kelompok, urut: m.urut,
        formatif: n ? n.formatif || null : null, sts: n ? n.sts ?? null : null, sas: n ? n.sas ?? null : null, nilai_akhir: n ? n.nilai_akhir ?? null : null, capaian: n ? n.capaian : null } : null;
    }).filter(Boolean);
    const c = M.catatan_rapor.find(x => x.siswa_id === s.id && x.tahun_ajaran_id === ta.id && x.jenis === p_jenis) || null;
    const j = k ? M.jurusan.find(x => x.id === k.jurusan_id) : null;
    const w = k ? M.guru.find(x => x.id === k.wali_guru_id) : null;
    const { kelas_id, aktif, agama, ...sv } = s;

function kecilkanGambar(file, maks = 300) {
  return new Promise((res, rej) => {
    if (!/^image\//.test(file.type)) return rej(new Error('File harus berupa gambar (PNG/JPG)'));
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, maks / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/png'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Gambar tidak bisa dibaca')); };
    img.src = url;
  });
}

function formMaster(key, row, R, onDone) {
  const cfg = MASTER[key];
  const val = f => row ? (f.type === 'password' ? '' : row[f.k]) : f.def;
  const input = f => {
    const v = val(f), req = f.req ? 'required' : '';
    if (f.type === 'select') return `<select class="input" name="${f.k}" ${req}><option value="">— Pilih —</option>${f.opts.map(([a, b]) => `<option value="${esc(a)}" ${v == a ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select>`;
    if (f.type === 'ref') return `<select class="input" name="${f.k}" ${req}><option value="">— Pilih —</option>${(R[f.ref] || []).map(o => `<option value="${o.id}" ${v == o.id ? 'selected' : ''}>${esc(o.kode && f.ref === 'jurusan' ? o.kode + ' — ' + o.nama : o.nama)}</option>`).join('')}</select>`;
    if (f.type === 'textarea') return `<textarea class="input" name="${f.k}" ${req}>${esc(v)}</textarea>`;
    if (f.type === 'check') return `<label class="check"><input type="checkbox" name="${f.k}" ${v ? 'checked' : ''}> ${esc(f.l)}</label>`;
    return `<input class="input" type="${f.type || 'text'}" name="${f.k}" value="${esc(v)}" ${req} placeholder="${esc(f.ph || '')}" ${f.type === 'password' ? 'autocomplete="new-password"' : ''}>`;
  };
  const m = modal({
    title: (row ? 'Ubah ' : 'Tambah ') + cfg.judul.replace(/^Data /, ''),
    body: `<form class="form-grid" id="fm">${cfg.fields.map(f => `<div class="field ${f.full ? 'full' : ''}">${f.type === 'check' ? '' : `<label>${esc(f.l)}${f.req ? ' <span style="color:var(--danger)">*</span>' : ''}</label>`}${input(f)}${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}</div>`).join('')}</form>`,
    foot: `<button class="btn btn-ghost" data-x>Batal</button><button class="btn btn-primary" data-save><i data-lucide="save"></i> Simpan</button>`
  });
  const fm = $('#fm', m.el);
  const simpan = async () => {
    if (!fm.reportValidity()) return;
    const d = {};
    for (const f of cfg.fields) {
      const el = fm.elements[f.k];
      if (f.type === 'check') { d[f.k] = el.checked; continue; }
      let v = el.value.trim();
      if (f.type === 'password') { if (v) { if (v.length < 6) return toast('Password minimal 6 karakter', 'err'); d[f.k] = v; } continue; }
      if (f.type === 'ref' || f.type === 'number') v = v === '' ? null : Number(v);
      d[f.k] = v === '' ? null : v;
    }
    await busy($('[data-save]', m.el), async () => {
      try {
        if (row) await api.update(key, row.id, d); else await api.insert(key, d);
        toast(row ? 'Perubahan disimpan' : 'Data ditambahkan'); m.close(); await onDone();
      } catch (e) { toast(errMsg(e), 'err'); }
    });
  };
  $('[data-save]', m.el).onclick = simpan;
  fm.onsubmit = e => { e.preventDefault(); simpan(); };
}

function imporSiswa(R, onDone) {
  const m = modal({
    title: 'Impor Data Siswa', wide: true,
    body: `<p class="muted" style="margin-top:0">Salin dari Excel/Google Sheets lalu tempel di bawah. Urutan kolom: <b>NISN, NIS, Nama, L/P, Nama Kelas</b>. Baris judul akan dilewati otomatis.</p>
      <textarea class="input" rows="10" id="imp-txt" placeholder="0091234567&#9;2601&#9;Ahmad Zaki&#9;L&#9;X TJKT 1"></textarea><div id="imp-info" class="small muted" style="margin-top:8px"></div>`,
    foot: `<button class="btn btn-ghost" data-x>Batal</button><button class="btn btn-primary" data-go-imp><i data-lucide="upload"></i> Impor</button>`
  });
  const parse = () => $('#imp-txt', m.el).value.split(/\r?\n/).map(l => l.split(/\t|;|,/).map(s => s.trim())).filter(c => c.length >= 3 && /^\d+$/.test(c[0]));
  $('#imp-txt', m.el).oninput = () => { $('#imp-info', m.el).textContent = parse().length + ' baris siswa terbaca.'; };
  $('[data-go-imp]', m.el).onclick = e => busy(e.currentTarget, async () => {
    const rows = parse();
    if (!rows.length) return toast('Tidak ada data valid. Kolom pertama harus NISN (angka).', 'err');
    const tidakAda = new Set();
    const data = rows.map(c => {
      const k = c[4] ? R.kelas.find(x => x.nama.toLowerCase() === c[4].toLowerCase()) : null;
      if (c[4] && !k) tidakAda.add(c[4]);
      return { nisn: c[0], nis: c[1] || null, nama: c[2], jk: /^p/i.test(c[3] || '') ? 'P' : /^l/i.test(c[3] || '') ? 'L' : null, kelas_id: k ? k.id : null, aktif: true };
    });
    try {
      await api.insert('siswa', data);
      toast(data.length + ' siswa berhasil diimpor' + (tidakAda.size ? ' (kelas tidak dikenal: ' + [...tidakAda].join(', ') + ')' : ''));
      m.close(); await onDone();
    } catch (er) { toast(errMsg(er), 'err'); }
  });
}

function capaianOtomatis(n, mapel) {
  if (n === null || n === '' || isNaN(n)) return '';
  n = Number(n);
  if (n >= 90) return `Menunjukkan penguasaan yang sangat baik dalam seluruh capaian kompetensi ${mapel}.`;
  if (n >= 80) return `Menunjukkan penguasaan yang baik dalam capaian kompetensi ${mapel}.`;
  if (n >= 70) return `Menunjukkan penguasaan yang cukup dalam capaian kompetensi ${mapel}, perlu peningkatan pada beberapa materi.`;
  return `Perlu bimbingan dalam memahami capaian kompetensi ${mapel}.`;
}
const predikat = n => n === null || n === '' || isNaN(n) ? '<span class="badge b-gray">—</span>' : n >= 90 ? '<span class="badge b-green">Sangat Baik</span>' : n >= 80 ? '<span class="badge b-blue">Baik</span>' : n >= 70 ? '<span class="badge b-amber">Cukup</span>' : '<span class="badge b-red">Perlu Bimbingan</span>';

// ---------- Perhitungan nilai (mengikuti form nilai Excel sekolah) ----------
const CPK = ['cp1', 'cp2', 'cp3'];
const NUM = v => v === null || v === undefined || v === '' || isNaN(v) ? null : Number(v);
const rata = arr => { const v = arr.map(NUM).filter(x => x !== null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
const bulat = v => v === null ? null : Math.round(v);
const rataCPk = (f, k) => rata((f && f[k]) || []);
const rataCP = f => rata(CPK.flatMap(k => (f && f[k]) || []));            // N. RATA-RATA CP
const semuaS = f => CPK.flatMap(k => (f && f[k]) || []);
const nilaiUTS = n => rata([...semuaS(n.formatif), n.sts]);                // rapor tengah semester = rata-rata semua S + STS
const nilaiRapor = n => rata([...semuaS(n.formatif), n.sts, n.sas]);       // N. RAPOR = rata-rata semua nilai (S CP1-CP3, STS, SAS)

function capaianDariCP(n, cps, mapel) {
  if (n === null || n === '' || isNaN(n)) return '';
  n = Number(n);
  const d = (cps || []).map(x => String(x || '').trim().replace(/\.+$/, '')).filter(Boolean).map(x => x[0].toLowerCase() + x.slice(1));
  if (!d.length) return capaianOtomatis(n, mapel);
  const gab = d.length > 1 ? d.slice(0, -1).join('; ') + '; serta ' + d[d.length - 1] : d[0];
  const pred = n >= 90 ? 'sangat baik' : n >= 80 ? 'baik' : 'cukup';
  return n >= 70 ? `Menunjukkan penguasaan yang ${pred} dalam ${gab}.` : `Perlu bimbingan dalam ${gab}.`;
}

// Baca file form nilai Excel (sheet "CP 1", "CP 2", "CP 3" berisi S1–S3, sheet "NILAI UJIAN" berisi N. STS & N. SAS)
async function bacaFormExcel(file) {
  const XLSX = await import('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/xlsx.mjs');
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
  const kunci = t => String(t ?? '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const hasil = { cp: {}, siswa: {} };
  const ambil = nama => hasil.siswa[nama] || (hasil.siswa[nama] = { formatif: { cp1: [null, null, null], cp2: [null, null, null], cp3: [null, null, null] } });
  for (const sn of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, defval: null, raw: true });
    const h = rows.findIndex(r => r && r.some(c => kunci(c) === 'NAMA'));
    if (h < 0) continue;
    const head = rows[h].map(kunci), iNama = head.indexOf('NAMA');
    const mCP = kunci(sn).match(/^CP(\d)/);
    if (mCP && +mCP[1] >= 1 && +mCP[1] <= 3) {
      const k = 'cp' + mCP[1];
      const desk = rows.slice(0, h).flat().filter(c => typeof c === 'string' && c.trim().length > 25 && !/CAPAIAN PEMBELAJARAN/i.test(c));
      if (desk.length) hasil.cp[k] = desk[0].trim();
      const iS = ['S1', 'S2', 'S3'].map(x => head.indexOf(x));
      rows.slice(h + 1).forEach(r => { if (!r || !r[iNama]) return; const o = ambil(kunci(r[iNama])); iS.forEach((ci, x) => { if (ci >= 0) o.formatif[k][x] = NUM(r[ci]); }); });
    } else {
      const iSts = head.findIndex(x => x.endsWith('STS')), iSas = head.findIndex(x => x.endsWith('SAS'));
      if (iSts < 0 && iSas < 0) continue;
      rows.slice(h + 1).forEach(r => { if (!r || !r[iNama]) return; const o = ambil(kunci(r[iNama])); if (iSts >= 0) o.sts = NUM(r[iSts]); if (iSas >= 0) o.sas = NUM(r[iSas]); });
    }
  }
  hasil.kunci = kunci;
  return hasil;
}

    const [kelas_id, mapel_id] = S.pilihNilai.split(':').map(Number);
    const o = semua.find(x => x.key === S.pilihNilai);
    const mode = o.punya_sub ? 'induk' : o.induk_id ? 'sub' : 'penuh';   // induk: nilai dari sub-mapel; sub: elemen tanpa capaian
    const box = $('#nilai-box'); box.innerHTML = loading();
    try {
      const res = await api.rpc('nilai_kelas', { p_token: tok(), p_kelas_id: kelas_id, p_mapel_id: mapel_id });
      const data = res.siswa || [], cp = res.cp || {};
      if (!data.length) { box.innerHTML = `<div class="card glass">${emptyState('Belum ada siswa di kelas ini', 'Tambahkan siswa dan pilih kelasnya di menu Siswa.', 'users')}</div>`; icons(); return; }
      const inp = (attr, val, w = 54) => `<input class="input input-sm" style="min-width:${w}px;width:${w}px;padding:6px 5px;text-align:center" type="number" min="0" max="100" step="0.01" ${attr} value="${val ?? ''}">`;
      const komponen = mode !== 'induk';
      const head = komponen
        ? `<tr><th class="num" rowspan="2">No</th><th rowspan="2">Nama Siswa</th>${CPK.map((k, i) => `<th colspan="3" style="text-align:center">CP ${i + 1}</th>`).join('')}<th rowspan="2">Rata² CP</th><th rowspan="2">STS</th><th rowspan="2">SAS</th><th rowspan="2">Nilai Rapor</th><th rowspan="2">Predikat</th>${mode === 'penuh' ? '<th rowspan="2" style="min-width:260px">Capaian Pembelajaran</th>' : ''}</tr>
           <tr>${CPK.map(() => '<th>S1</th><th>S2</th><th>S3</th>').join('')}</tr>`
        : `<tr><th class="num">No</th><th>Nama Siswa</th><th>Nilai Rapor</th><th>Predikat</th><th style="min-width:300px">Capaian Pembelajaran</th></tr>`;
      const baris = (r, i) => komponen
        ? `<tr data-id="${r.siswa_id}"><td class="num">${i + 1}</td><td style="min-width:150px"><b>${esc(r.nama)}</b><div class="small muted">${esc(r.nisn)}</div></td>
            ${CPK.map(k => [0, 1, 2].map(x => `<td style="padding:6px 3px">${inp(`data-f="${k}" data-x="${x}"`, ((r.formatif || {})[k] || [])[x])}</td>`).join('')).join('')}
            <td class="ctr" data-rcp style="text-align:center;font-weight:700">${bulat(rataCP(r.formatif)) ?? '-'}</td>
            <td>${inp('data-sts', r.sts)}</td><td>${inp('data-sas', r.sas)}</td><td>${inp('data-n readonly tabindex="-1" title="Otomatis: rata-rata semua nilai" style="background:rgba(16,185,129,.08);font-weight:700"', bulat(nilaiRapor(r)) ?? '', 64)}</td>
            <td data-p>${predikat(bulat(nilaiRapor(r)))}</td>${mode === 'penuh' ? `<td><textarea class="input input-sm" rows="2" data-c>${esc(r.capaian)}</textarea></td>` : ''}</tr>`
        : `<tr data-id="${r.siswa_id}"><td class="num">${i + 1}</td><td><b>${esc(r.nama)}</b><div class="small muted">${esc(r.nisn)}</div></td>
            <td>${inp('data-n placeholder="otomatis"', r.nilai_akhir, 90)}</td><td data-p>${predikat(NUM(r.nilai_akhir))}</td><td><textarea class="input input-sm" rows="2" data-c>${esc(r.capaian)}</textarea></td></tr>`;
      box.innerHTML = `${mode === 'penuh' ? `<div class="card glass"><div class="card-head"><h3>Capaian Pembelajaran (CP)</h3><div class="spacer"></div><span class="small muted">Dipakai untuk menyusun capaian otomatis</span></div>
          <div class="stack" style="gap:10px">${CPK.map((k, i) => `<div class="field"><label>CP ${i + 1}</label><input class="input" data-cpdesk="${k}" value="${esc(cp[k])}" placeholder="contoh: Menerapkan strategi dekomposisi, pengenalan pola, abstraksi, dan algoritma ..."></div>`).join('')}</div></div>` : ''}
        <div class="card glass"><div class="card-head"><div><h3>${o.induk ? esc(o.induk) + ' › ' : ''}${esc(o.mapel)}</h3><div class="small muted">${esc(o.kelas)} · ${data.length} siswa · Nilai 0–100${mode === 'induk' ? ' · Mapel ini punya sub-mapel: Nilai Rapor dikosongkan = rata-rata nilai sub-mapel' : ' · Nilai Rapor otomatis = rata-rata semua nilai (S1–S3 CP1–CP3, STS, SAS)'}</div></div><div class="spacer"></div>
          <div class="toolbar">${komponen ? '<label class="btn btn-ghost" style="margin:0"><i data-lucide="file-spreadsheet"></i> Impor Form Excel<input type="file" accept=".xlsx,.xls" id="imp-xls" hidden></label>' : ''}
            ${mode !== 'sub' ? '<button class="btn btn-ghost" id="btn-auto"><i data-lucide="sparkles"></i> Capaian Otomatis</button>' : ''}<button class="btn btn-primary" id="btn-sv"><i data-lucide="save"></i> Simpan Nilai</button></div></div>
          <div class="table-wrap"><table class="tbl nilai-tbl"><thead>${head}</thead><tbody>${data.map(baris).join('')}</tbody></table></div></div>`;
      icons();
      const nilaiBaris = tr => ({
        formatif: komponen ? Object.fromEntries(CPK.map(k => [k, [0, 1, 2].map(x => NUM($(`[data-f="${k}"][data-x="${x}"]`, tr).value))])) : null,
        sts: komponen ? NUM($('[data-sts]', tr).value) : null, sas: komponen ? NUM($('[data-sas]', tr).value) : null
      });
      const hitung = tr => {
        const n = nilaiBaris(tr);
        $('[data-rcp]', tr).textContent = bulat(rataCP(n.formatif)) ?? '-';
        $('[data-n]', tr).value = bulat(nilaiRapor(n)) ?? '';
        $('[data-p]', tr).innerHTML = predikat(NUM($('[data-n]', tr).value));
      };
      $$('[data-f],[data-sts],[data-sas]', box).forEach(el => el.oninput = () => hitung(el.closest('tr')));
      $$('[data-n]', box).forEach(el => el.oninput = () => { el.closest('tr').querySelector('[data-p]').innerHTML = predikat(NUM(el.value)); });
      const ba = $('#btn-auto');
      if (ba) ba.onclick = () => {
        const cps = CPK.map(k => { const el = $(`[data-cpdesk="${k}"]`, box); return el ? el.value : ''; });
        let c = 0;
        $$('tbody tr', box).forEach(tr => { const n = $('[data-n]', tr).value, t = $('[data-c]', tr); if (n !== '' && !t.value.trim()) { t.value = capaianDariCP(n, cps, o.mapel); c++; } });
        toast(c ? c + ' capaian diisi otomatis (yang kosong saja)' : 'Tidak ada capaian kosong yang punya nilai', 'info');
      };
      const ix = $('#imp-xls');
      if (ix) ix.onchange = async e => {
        const f = e.target.files[0]; e.target.value = ''; if (!f) return;
        try {
          const h = await bacaFormExcel(f);
          let cocok = 0; const pakai = new Set();
          $$('tbody tr', box).forEach(tr => {
            const nama = $('td:nth-child(2) b', tr).textContent, d = h.siswa[h.kunci(nama)];
            if (!d) return; cocok++; pakai.add(h.kunci(nama));
            CPK.forEach(k => [0, 1, 2].forEach(x => { $(`[data-f="${k}"][data-x="${x}"]`, tr).value = d.formatif[k][x] ?? ''; }));
            if (d.sts !== undefined) $('[data-sts]', tr).value = d.sts ?? '';
            if (d.sas !== undefined) $('[data-sas]', tr).value = d.sas ?? '';
            hitung(tr);
          });
          CPK.forEach(k => { const el = $(`[data-cpdesk="${k}"]`, box); if (el && h.cp[k]) el.value = h.cp[k]; });
          const lewat = Object.keys(h.siswa).filter(k => !pakai.has(k)).length;
          toast(`${cocok} siswa terisi dari Excel${lewat ? `, ${lewat} nama di Excel tidak cocok` : ''}. Periksa lalu klik Simpan.`, cocok ? 'ok' : 'err');
        } catch (er) { toast('Gagal membaca Excel: ' + errMsg(er), 'err'); }
      };
      $('#btn-sv').onclick = e => busy(e.currentTarget, async () => {
        const rows = [];
        for (const tr of $$('tbody tr', box)) {
          const n = nilaiBaris(tr), na = NUM($('[data-n]', tr).value);
          const angkaSemua = [...(n.formatif ? CPK.flatMap(k => n.formatif[k]) : []), n.sts, n.sas, na].filter(x => x !== null);
          if (angkaSemua.some(x => x < 0 || x > 100)) { toast('Nilai harus antara 0 dan 100 (' + $('td:nth-child(2) b', tr).textContent + ')', 'err'); return; }
          const c = $('[data-c]', tr);
          rows.push({ siswa_id: Number(tr.dataset.id), formatif: n.formatif, sts: n.sts, sas: n.sas, nilai_akhir: na, capaian: c ? (c.value.trim() || null) : null });
        }
        const cpEl = $$('[data-cpdesk]', box);
        const p_cp = cpEl.length ? Object.fromEntries(cpEl.map(el => [el.dataset.cpdesk, el.value.trim() || null])) : null;
        try { const c = await api.rpc('simpan_nilai', { p_token: tok(), p_kelas_id: kelas_id, p_mapel_id: mapel_id, p_cp, p_data: rows }); toast(c + ' nilai tersimpan'); }
        catch (er) { toast(errMsg(er), 'err'); }
      });
    } catch (e) { box.innerHTML = `<div class="card glass">${emptyState('Gagal memuat', errMsg(e), 'alert-triangle')}</div>`; icons(); }
  };
  $('#sel-km').onchange = muat;
  await muat();
}

// ---------- Rapor ----------
const TINGKAT_KATA = { X: 'Sepuluh', XI: 'Sebelas', XII: 'Dua belas' };
const TINGKAT_BERIKUT = { X: 'XI', XI: 'XII' };
const angka = v => v === null || v === undefined || v === '' ? '' : Math.round(Number(v));
const tglAngka = d => { if (!d) return '..........'; const [y, m, h] = String(d).split('-'); return `${h}-${m}-${y}`; };
const pecahBaris = t => String(t || '').split(/\n/).map(x => x.trim()).filter(Boolean).map(x => { const i = x.indexOf(':'); return i > 0 ? [x.slice(0, i).trim(), x.slice(i + 1).trim()] : [x, '']; });

// Susun mapel: urut per kelompok, sub-mapel (elemen) di bawah induknya
function susunMapel(nilai) {
  const byId = {};
  nilai.forEach(n => { byId[n.id] = { ...n, sub: [] }; });
  const atas = [];
  Object.values(byId).forEach(n => { if (n.induk_id && byId[n.induk_id]) byId[n.induk_id].sub.push(n); else atas.push(n); });
  atas.sort((a, b) => (KEL_URUT[a.kelompok] - KEL_URUT[b.kelompok]) || (a.urut - b.urut) || cmp(a.mapel, b.mapel));
  atas.forEach(a => a.sub.sort((x, y) => (x.urut - y.urut) || cmp(x.mapel, y.mapel)));
  return atas;
}

function latarRapor(sk) {
  const t = String(sk.nama || 'SMK Mambaul Ulum').toUpperCase() + ' * ';

  return `background-image:url('data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}')`;
}

function htmlRapor(d) { return d.jenis === 'UTS' ? htmlRaporUTS(d) : htmlRaporSemester(d); }

    <table class="ident2"><tr><td><table>${kv('Nama', esc(s.nama))}${kv('NISN', esc(s.nisn || '-'))}${kv('No. Induk', esc(s.nis || '-'))}</table></td>

    <table class="nil hadir-uts"><tr><td style="width:28%" class="ctr"><b>KETIDAKHADIRAN</b></td><td>Sakit : ${c.sakit ?? 0} Hari</td><td>Izin : ${c.izin ?? 0} Hari</td><td>Tanpa Keterangan : ${c.alpa ?? 0} Hari</td></tr></table>

function htmlRaporSemester(d) {
  const sk = d.sekolah || {}, s = d.siswa, ta = d.tahun_ajaran, c = d.catatan || {};
  const genap = ta.semester === 'Genap', tingkat = d.kelas ? d.kelas.tingkat : '';
  const kv = (a, b) => `<tr><td style="width:125px">${a}</td><td style="width:10px">:</td><td>${b}</td></tr>`;
  const ident = `<table class="ident3"><tr><td><table>
      ${kv('Nama Peserta Didik', `<b>${esc((s.nama || '').toUpperCase())}</b>`)}${kv('NISN / NIPD', esc((s.nisn || '-') + ' / ' + (s.nis || '-')))}${kv('Kelas', esc(tingkat || '-'))}
      ${kv('Semester', genap ? '2 (dua) / Genap' : '1 (satu) / Ganjil')}${kv('Konsentrasi Keahlian', esc(d.jurusan ? d.jurusan.nama : '-'))}</table></td>
    <td><table>${kv('Nama Sekolah', esc((sk.nama || '').toUpperCase()))}${kv('Alamat Sekolah', esc((sk.alamat || '-').toUpperCase()))}${kv('Fase', tingkat === 'X' ? 'E' : 'F')}${kv('Tahun Pelajaran', esc(ta.nama))}</table></td></tr></table>`;
  const mapel = susunMapel(d.nilai);
  // nilai rapor: isian guru, atau dihitung dari komponen; mapel induk = rata-rata sub-mapelnya
  const nRapor = m => m.sub && m.sub.length ? (NUM(m.nilai_akhir) ?? rata(m.sub.map(nRapor))) : (bulat(nilaiRapor(m)) ?? NUM(m.nilai_akhir));
  const nilaiRows = mapel.map((m, i) => `<tr><td class="ctr">${i + 1}</td><td>${esc(m.mapel)}</td><td class="ctr">${angka(nRapor(m)) || '-'}</td><td class="cap">${esc(m.capaian || '-')}</td></tr>`).join('');
  const daftar = (judul, kolom, isi) => {
    const r = pecahBaris(isi);
    return `<table class="nil blok"><thead><tr><th style="width:34px">No</th><th style="width:45%">${judul}</th><th>${kolom}</th></tr></thead><tbody>
      ${(r.length ? r : [['-', '-']]).map(([a, b], i) => `<tr><td class="ctr">${i + 1}</td><td class="ctr">${esc(a)}</td><td class="ctr">${esc(b || '-')}</td></tr>`).join('')}</tbody></table>`;
  };
  const kep = c.keputusan === 'Tidak Naik Kelas' ? 'Tinggal Kelas' : c.keputusan;
  const coret = (teks, pilih) => kep && !pilih ? `<s>${teks}</s>` : teks;
  const keputusan = !genap ? '' : `<table class="nil blok"><tr><td><b>KEPUTUSAN</b><br>Berdasarkan hasil yang dicapai pada semester 1 dan 2, peserta didik dinyatakan:<br>
      ${tingkat === 'XII'
        ? `${coret('Lulus', kep === 'Lulus')} / ${coret('Tidak Lulus', kep === 'Tidak Lulus')}*)`
        : `${coret('Naik', kep === 'Naik Kelas')} / ${coret('Tinggal', kep === 'Tinggal Kelas')}*) ke kelas ${esc(TINGKAT_BERIKUT[tingkat] || '....')} ( ${esc(TINGKAT_KATA[TINGKAT_BERIKUT[tingkat]] || '....')} )`}<br><i>*) coret yang tidak perlu</i></td></tr></table>`;
  return `<div class="paper rapor" style="${latarRapor(sk)}"><img class="wm" src="${sk.logo || S.logo}" alt="">
    <table class="halaman"><thead><tr><td>${ident}<div class="garis-id"></div></td></tr></thead><tbody><tr><td>
      <table class="nil"><thead><tr><th colspan="4" class="judul">LAPORAN HASIL BELAJAR</th></tr>
        <tr><th style="width:34px">No</th><th style="width:30%">Mata Pelajaran</th><th style="width:62px">Nilai Akhir</th><th>Capaian Pembelajaran</th></tr></thead>
        <tbody>${nilaiRows || '<tr><td colspan="4" class="ctr">Belum ada mata pelajaran</td></tr>'}</tbody></table>
      <table class="nil blok"><thead><tr><th>Kokurikuler</th></tr></thead><tbody><tr><td style="height:60px">${esc(c.kokurikuler || '-')}</td></tr></tbody></table>
      ${daftar('Kegiatan Ekstrakurikuler', 'Keterangan', c.ekstrakurikuler)}
      ${daftar('Prestasi', 'Keterangan', c.prestasi)}
      <div class="dua blok"><table class="nil"><thead><tr><th colspan="3">Ketidakhadiran</th></tr></thead><tbody>
          <tr><td>Sakit</td><td class="ctr" style="width:40px">${c.sakit ?? 0}</td><td style="width:40px">hari</td></tr>
          <tr><td>Izin</td><td class="ctr">${c.izin ?? 0}</td><td>hari</td></tr>
          <tr><td>Tanpa Keterangan</td><td class="ctr">${c.alpa ?? 0}</td><td>hari</td></tr></tbody></table>
        <table class="nil"><thead><tr><th>Catatan Wali Kelas</th></tr></thead><tbody><tr><td style="height:66px">${esc(c.catatan_wali || '-')}</td></tr></tbody></table></div>
      ${genap ? keputusan : '<table class="nil blok"><thead><tr><th>Tanggapan Orang Tua / Wali Murid</th></tr></thead><tbody><tr><td style="height:46px"></td></tr></tbody></table>'}
      ${ttdRapor(d, esc(tglIndo(ta.tanggal_rapor)), 'Mengetahui,<br>Kepala Sekolah')}
    </td></tr></tbody></table>
  </div>`;
}

function cetak(html) { $('#print-area').innerHTML = html; setTimeout(() => window.print(), 150); }

async function lihatRapor(siswaId, taId, jenis) {
  const m = modal({ title: 'Pratinjau Rapor', wide: true, body: '<div style="display:grid;place-items:center;padding:40px"><span class="spin dark"></span></div>',
    foot: `<button class="btn btn-ghost" data-x>Tutup</button><button class="btn btn-primary" data-print disabled><i data-lucide="printer"></i> Cetak / Simpan PDF</button>` });
  try {
    const d = await api.rpc('rapor_siswa', { p_token: tok(), p_siswa_id: siswaId, p_ta_id: taId || null, p_jenis: jenis });
    const html = htmlRapor(d);
    $('.modal-body', m.el).innerHTML = `<div style="background:#E2E8F0;padding:14px;border-radius:12px">${html}</div>`;
    const b = $('[data-print]', m.el); b.disabled = false; b.onclick = () => cetak(html);
  } catch (e) { $('.modal-body', m.el).innerHTML = emptyState('Gagal memuat rapor', errMsg(e), 'alert-triangle'); icons(); }
}

async function pageRapor(v) {
  const [kelas, taList] = await Promise.all([kelasPilihan(), api.list('tahun_ajaran', { order: 'id', asc: false })]);
  if (!kelas.length) { v.innerHTML = `<div class="card glass">${emptyState('Belum ada kelas', '', 'school')}</div>`; return; }
  if (!taList.length) { v.innerHTML = `<div class="card glass">${emptyState('Belum ada tahun ajaran', '', 'calendar-x')}</div>`; return; }
  const taDef = (S.taAktif && S.taAktif.id) || taList[0].id;
  const pj = pilihJenis(() => muat());
  v.innerHTML = `<div class="card glass">${pj.html}<div class="form-grid">
      <div class="field"><label>Kelas</label><select class="input" id="sel-k">${kelas.map(k => `<option value="${k.id}" ${S.pilihKelas == k.id ? 'selected' : ''}>${esc(k.nama)}</option>`).join('')}</select></div>
      <div class="field"><label>Tahun Ajaran / Semester</label><select class="input" id="sel-ta">${taList.map(t => `<option value="${t.id}" ${t.id === taDef ? 'selected' : ''}>${esc(t.nama)} — ${esc(t.semester)}${t.aktif ? ' (aktif)' : ''}</option>`).join('')}</select></div>
    </div></div><div id="rap-box" style="margin-top:16px"></div>`;
  const muat = async () => {
    const kid = Number($('#sel-k').value); S.pilihKelas = kid;
    const box = $('#rap-box'); box.innerHTML = loading();
    try {
      const siswa = S.user.peran === 'admin'
        ? (await api.list('siswa', { select: 'id,nisn,nama,kelas_id,aktif', eq: { kelas_id: kid, aktif: true }, order: 'nama' })).map(s => ({ siswa_id: s.id, nisn: s.nisn, nama: s.nama }))
        : await api.rpc('catatan_kelas', { p_token: tok(), p_kelas_id: kid, p_jenis: S.jenis });
      if (!siswa.length) { box.innerHTML = `<div class="card glass">${emptyState('Belum ada siswa di kelas ini', '', 'users')}</div>`; icons(); return; }
      box.innerHTML = `<div class="card glass"><div class="card-head"><h3>Daftar Siswa</h3><span class="badge ${S.jenis === 'UTS' ? 'b-amber' : 'b-green'}">Rapor ${jenisLbl(S.jenis)}</span><span class="badge b-gray">${siswa.length} siswa</span><div class="spacer"></div>
        <button class="btn btn-accent" id="btn-all"><i data-lucide="printer"></i> Cetak Semua</button></div>
        <div class="table-wrap"><table class="tbl"><thead><tr><th class="num">No</th><th>NISN</th><th>Nama</th><th class="act">Aksi</th></tr></thead>
        <tbody>${siswa.map((s, i) => `<tr><td class="num">${i + 1}</td><td>${esc(s.nisn)}</td><td><b>${esc(s.nama)}</b></td><td class="act"><button class="btn btn-ghost btn-sm" data-r="${s.siswa_id}"><i data-lucide="eye"></i> Lihat & Cetak</button></td></tr>`).join('')}</tbody></table></div></div>`;
      icons();
      $$('[data-r]', box).forEach(b => b.onclick = () => lihatRapor(Number(b.dataset.r), Number($('#sel-ta').value), S.jenis));
      $('#btn-all').onclick = e => busy(e.currentTarget, async () => {
        try {
          const taId = Number($('#sel-ta').value), parts = [];
          for (const s of siswa) parts.push(htmlRapor(await api.rpc('rapor_siswa', { p_token: tok(), p_siswa_id: s.siswa_id, p_ta_id: taId, p_jenis: S.jenis })));
          cetak(parts.join(''));
        } catch (er) { toast(errMsg(er), 'err'); }
      });
    } catch (e) { box.innerHTML = `<div class="card glass">${emptyState('Gagal memuat', errMsg(e), 'alert-triangle')}</div>`; icons(); }
  };
  pj.bind(v);
  $('#sel-k').onchange = muat;
  await muat();
}

async function pageAkun(v) {
  const info = S.user.peran === 'guru' ? `Username: <b>${esc(S.guru.guru.username)}</b>` : `Email: <b>${esc(S.user.email)}</b>`;
  v.innerHTML = `<div class="card glass" style="max-width:520px"><div class="card-head"><div class="avatar" style="width:48px;height:48px;font-size:16px">${esc(inisial(S.user.nama))}</div><div><h3>${esc(S.user.nama)}</h3><div class="small muted">${info}</div></div></div>
    <form id="f-pw" class="stack"><h4>Ganti Password</h4>
      <div class="field"><label>Password Lama</label><input class="input" type="password" name="a" required autocomplete="current-password"></div>
      <div class="field"><label>Password Baru (min. 6 karakter)</label><input class="input" type="password" name="b" minlength="6" required autocomplete="new-password"></div>
      <div class="field"><label>Ulangi Password Baru</label><input class="input" type="password" name="c" minlength="6" required autocomplete="new-password"></div>
      <button class="btn btn-primary" type="submit"><i data-lucide="key-round"></i> Simpan Password</button></form>
    <div style="height:14px"></div><button class="btn btn-ghost btn-block" id="btn-lo"><i data-lucide="log-out"></i> Keluar</button></div>`;
  $('#btn-lo').onclick = logout;
  $('#f-pw').onsubmit = e => {
    e.preventDefault(); const f = e.target;
    if (f.b.value !== f.c.value) return toast('Konfirmasi password tidak sama', 'err');
    busy($('button[type=submit]', f), async () => {
      try { await api.rpc('ganti_password', { p_token: tok(), p_lama: f.a.value, p_baru: f.b.value }); toast('Password berhasil diganti'); f.reset(); }
      catch (er) { toast(errMsg(er), 'err'); }
    });
  };
}

async function pagePengaturan(v) {
  const sk = (await api.list('sekolah'))[0] || { id: 1 };
  const F = [['nama', 'Nama Sekolah', 1], ['npsn', 'NPSN'], ['alamat', 'Alamat', 1], ['kota', 'Kota/Kabupaten (untuk tanda tangan)'], ['telepon', 'Telepon'], ['email', 'Email'], ['kepala_sekolah', 'Nama Kepala Sekolah'], ['nip_kepsek', 'NIP Kepala Sekolah']];
  v.innerHTML = `<div class="card glass"><div class="card-head"><h3>Logo Sekolah</h3></div>
      <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
        <img id="logo-prev" src="${esc(sk.logo || LOGO_DEFAULT)}" alt="Logo" style="width:96px;height:96px;object-fit:contain;border-radius:14px;background:#fff;border:1px solid var(--border);padding:6px">
        <div class="stack" style="gap:8px;flex:1;min-width:200px">
          <div class="small muted">Tampil di halaman login, menu, dan kop rapor. Gunakan PNG/JPG persegi (latar transparan lebih bagus). Otomatis diperkecil.</div>
          <div class="toolbar"><label class="btn btn-primary" style="margin:0"><i data-lucide="upload"></i> Unggah Logo<input type="file" accept="image/png,image/jpeg,image/webp" id="logo-file" hidden></label>
            <button class="btn btn-ghost" id="logo-reset"><i data-lucide="rotate-ccw"></i> Pakai Logo Bawaan</button></div>
        </div></div></div>
    <div class="card glass"><div class="card-head"><h3>Identitas Sekolah</h3><div class="spacer"></div><button class="btn btn-primary" id="btn-sk"><i data-lucide="save"></i> Simpan</button></div>
      <form class="form-grid" id="f-sk">${F.map(([k, l, full]) => `<div class="field ${full ? 'full' : ''}"><label>${l}</label><input class="input" name="${k}" value="${esc(sk[k])}"></div>`).join('')}</form></div>
    <div id="ta-host" style="margin-top:16px"></div>`;
  const simpanLogo = async logo => {
    try { await api.update('sekolah', 1, { logo }); terapkanLogo(logo); toast('Logo sekolah diperbarui'); renderShell(); }
    catch (er) { toast(errMsg(er), 'err'); }
  };
  $('#logo-file').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { await simpanLogo(await kecilkanGambar(f)); } catch (er) { toast(errMsg(er), 'err'); }
  };
  $('#logo-reset').onclick = e => busy(e.currentTarget, () => simpanLogo(null));
  $('#btn-sk').onclick = e => busy(e.currentTarget, async () => {
    const f = $('#f-sk'), d = {};
    F.forEach(([k]) => d[k] = f.elements[k].value.trim() || null);
    if (!d.nama) return toast('Nama sekolah wajib diisi', 'err');
    try { await api.update('sekolah', 1, d); toast('Identitas sekolah disimpan'); } catch (er) { toast(errMsg(er), 'err'); }
  });
  await pageMaster('tahun_ajaran', $('#ta-host'));
}

const PAGES = {
  beranda: v => S.user.peran === 'admin' ? pageBerandaAdmin(v) : pageBerandaGuru(v),
  siswa: v => pageMaster('siswa', v), guru: v => pageMaster('guru', v), kelas: v => pageMaster('kelas', v),
  mapel: v => pageMaster('mapel', v), jurusan: v => pageMaster('jurusan', v), mengajar: v => pageMaster('mengajar', v),
  nilai: pageNilai, catatan: pageCatatan, rapor: pageRapor, akun: pageAkun, pengaturan: pagePengaturan
};

// ====================================================================
//  INISIALISASI
// ====================================================================
async function init() {
  terapkanLogo(null);
  if (IS_PREVIEW) await muatLogo();
  if (!IS_PREVIEW) {
    if (!/^https?:\/\//.test(SUPABASE_URL)) {
      $('#app').innerHTML = `<div class="login-wrap"><div class="login-card glass">${emptyState('Konfigurasi belum lengkap', 'Isi SUPABASE_URL dan SUPABASE_ANON_KEY di index.html.', 'settings')}</div></div>`;
      icons(); return;
    }
    const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm');
    sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    await muatLogo();
    try {
      const u = await api.sessionAdmin();
      if (u) { S.user = { peran: 'admin', nama: 'Administrator', email: u.email }; await masuk(); return; }
      const sesi = lsGet();
      if (sesi && sesi.token && sesi.peran === 'guru') { S.user = sesi; await masuk(); return; }
      lsSet(null);
    } catch (e) { lsSet(null); S.user = null; }
  }
  renderLogin();
}

// PWA: daftarkan service worker (hanya bila di-host via https / localhost)
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { /* PWA opsional */ }));
}

init();
</script>
